name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Build a release APK and publish it as a GitHub Release'
        type: boolean
        default: false
      version:
        description: 'Version tag for the release (e.g. v1.0.0)'
        type: string
        default: 'v1.0.0'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMGR=$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "SDK packages installed"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK exists and report details
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          ls -lh "$APK"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/aapt2" dump badging "$APK" | head -5
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: genz-keyboard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Release APK
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMGR=$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # A release APK must be signed with a key that stays the same across releases, or
      # installed copies can never be updated. The key is never committed: it is supplied
      # through repository secrets. Without them the build falls back to the debug key,
      # which is fine for testing but means a later release cannot update an earlier one.
      - name: Configure release signing
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "Using keystore from repository secrets"
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
            {
              echo "RELEASE_STORE_FILE=release.keystore"
              echo "RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
              echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
              echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
            } >> local.properties
            echo "SIGNING=release key" >> "$GITHUB_ENV"
          else
            echo "No keystore secrets set - the release APK will be signed with the debug key"
            echo "SIGNING=debug key (testing only)" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Inspect release APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          if [ -z "$APK" ]; then
            echo "::error::Release APK was not produced"
            exit 1
          fi
          ls -lh "$APK"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/aapt2" dump badging "$APK" | head -3
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" | head -5
          cp "$APK" "GenZKeyboard-${{ inputs.version }}.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.version }}
          SIGNING: ${{ env.SIGNING }}
        run: |
          NOTES=$(cat <<'EOF'
          GenZ Keyboard - an Android keyboard built with Kotlin and Jetpack Compose, in the
          Material 3 Expressive design language.

          Created by Umaiz Sufiyan (https://github.com/sufiyan-sabeel).

          ### What changed in 1.0.3
          - **The anime themes now have real artwork behind the keys.** Ten illustrations, one
            per theme, drawn behind the actual keyboard - not colour-only gradients any more.
            The picture shows through in every app, in every layout, and the keyboard keeps its
            dimming, blur and transparency controls.
          - **Palettes sampled from the art.** Each theme's accent and key colours are computed
            from its own picture, so the keys, Enter, spacebar and suggestion bar match the
            illustration instead of being guessed.
          - **New gallery.** Every card shows its artwork with the mini keyboard over it, and
            has working Preview and Apply buttons. Preview opens a full-size look with the
            theme description; Apply switches the keyboard immediately. There is also a Reset
            theme action.
          - Artwork is cropped to a 16:9 keyboard strip around the subject, sharpened, and
            stored as WebP - about 850 KB for all ten.

          ### Artwork notice
          The illustrations are supplied by the project owner and are not covered by the MIT
          licence, which covers the code only. They depict third-party characters, and two
          carry other artists' signatures. Confirm you hold the rights before redistributing
          this build publicly; replacing the files in app/src/main/assets/anime/ swaps the art
          with no code changes.

          ### Install
          1. Download the APK below.
          2. Allow installation from your browser or file manager.
          3. Open GenZ Keyboard, then enable it in
             Settings -> System -> Languages & input -> On-screen keyboard -> Manage keyboards.

          ### Signing
          This build is signed with the **debug key** unless repository signing secrets are
          configured. A debug-key build is fine for testing, but a later release signed with
          a different key cannot update it - you would have to uninstall first.

          ### Source
          Full source and licence: https://github.com/sufiyan-sabeel/genZ-keyboard
          EOF
          )
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists - replacing the APK asset and refreshing the notes"
            gh release upload "$TAG" "GenZKeyboard-$TAG.apk" --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" "GenZKeyboard-$TAG.apk"               --title "GenZ Keyboard $TAG"               --notes "$NOTES"
          fi
