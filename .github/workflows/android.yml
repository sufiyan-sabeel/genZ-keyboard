name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_release_apk:
        description: 'Build the signed production release APK (no publish)'
        type: boolean
        default: false
      publish_release:
        description: 'Build a release APK and publish it as a GitHub Release'
        type: boolean
        default: false
      version:
        description: 'Version tag for the release (e.g. v1.0.0)'
        type: string
        default: 'v1.0.0'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMGR=$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "SDK packages installed"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Version consistency
        run: bash scripts/check-release-version.sh

      - name: Artwork provenance
        run: python3 scripts/check-artwork-provenance.py

      # The gate that blocks a release is only worth having if it is itself tested. These cases
      # build throwaway trees and assert that an unverified standard asset fails the release
      # mode and that an APK bundling one is refused.
      - name: Artwork gate tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Unit tests
        run: ./gradlew testStandardDebugUnitTest --stacktrace

      - name: Compile instrumentation tests
        run: ./gradlew assembleStandardDebugAndroidTest --stacktrace

      - name: Dependency policy check (F-Droid)
        run: |
          ./gradlew :app:dependencies --configuration fdroidReleaseRuntimeClasspath > deps.txt 2>&1 || {
            echo "::error::could not resolve the fdroid release classpath"; tail -40 deps.txt; exit 1; }
          DENY='com\.google\.mlkit|com\.google\.firebase|com\.google\.android\.gms|com\.google\.android\.play|com\.applovin|com\.unity3d\.ads|com\.facebook\.ads|com\.adjust\.sdk'
          if grep -Eq "$DENY" deps.txt; then
            echo "::error::proprietary dependency on the fdroid runtime classpath"
            grep -E "$DENY" deps.txt | sort -u | head -20
            exit 1
          fi
          echo "no known proprietary dependencies on the fdroid runtime classpath"
          echo "resolved artifacts: $(grep -cE '^[+\\| ]' deps.txt)"

      - name: Build F-Droid flavour (no proprietary assets)
        run: ./gradlew assembleFdroidRelease --stacktrace

      # Both release paths are checked against the same inventory. The fdroid flavour must
      # bundle no artwork at all, so this inspects the artifact rather than trusting the
      # source tree.
      - name: F-Droid APK carries no artwork
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/fdroid/release/*.apk | head -1)
          python3 scripts/check-artwork-provenance.py --apk "$APK"

      - name: Build debug APK
        run: ./gradlew assembleStandardDebug --stacktrace

      - name: Verify APK exists and report details
        run: |
          APK=$(ls app/build/outputs/apk/standard/debug/*.apk | head -1)
          ls -lh "$APK"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/aapt2" dump badging "$APK" | head -5
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # Reports what the debug build actually bundles, so the reason it is not uploaded is visible
      # in the log rather than only in this file's comments.
      - name: Report artwork bundled in the debug APK
        run: |
          set -euo pipefail
          python3 scripts/check-artwork-provenance.py --apk "$APK_PATH"

      - name: Verify the two flavours differ as intended
        run: |
          STD=$(ls app/build/outputs/apk/standard/debug/*.apk | head -1)
          FD=$(ls app/build/outputs/apk/fdroid/release/*.apk | head -1)
          count() { unzip -l "$1" | grep -c "assets/anime/" || true; }
          STD_N=$(count "$STD"); FD_N=$(count "$FD")
          echo "standard artwork files: $STD_N"
          echo "fdroid artwork files:   $FD_N"
          if [ "$STD_N" -lt 10 ]; then echo "::error::standard build is missing anime artwork"; exit 1; fi
          if [ "$FD_N" -ne 0 ]; then echo "::error::fdroid build must not bundle third-party artwork"; exit 1; fi
          echo "flavour separation verified"

      - name: Upload F-Droid flavour APK
        uses: actions/upload-artifact@v4
        with:
          name: genz-keyboard-fdroid-apk
          path: app/build/outputs/apk/fdroid/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # The standard debug APK bundles the sixteen illustrations whose rights are unrecorded, and on
      # a public repository an Actions artifact is downloadable by anyone with an account. It is no
      # longer published. The build still runs and is still verified above; build locally with
      # `./gradlew assembleStandardDebug` when a debug APK is needed, and use the F-Droid artifact
      # above for a downloadable build that carries no artwork.
      - name: Debug APK is not published
        run: |
          echo "The standard debug APK is built and checked, but not uploaded."
          echo "Reason: it bundles the artwork that docs/artwork-provenance.md records as unverified."
          echo "Build it locally with: ./gradlew assembleStandardDebug"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

  release-apk:
    name: Signed release APK (no publish)
    if: github.event_name == 'workflow_dispatch' && inputs.build_release_apk
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMGR=$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Version consistency
        run: bash scripts/check-release-version.sh "${{ inputs.version }}"

      # Release licensing gate. A standard release APK may not carry artwork whose rights are
      # unrecorded. Runs unconditionally, before signing and before any build, and has no
      # override: the way past it is to record the rights, not to skip the check.
      - name: Artwork licensing gate (release)
        run: python3 scripts/check-artwork-provenance.py --release

      # Secrets are written to files and environment only; nothing here is echoed.
      - name: Configure production signing
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::RELEASE_KEYSTORE_B64 is not configured. A production release cannot be built without it."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > release.keystore
          {
            echo "RELEASE_STORE_FILE=release.keystore"
            echo "RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> local.properties
          echo "Signing material written to local.properties (values not printed)"

      - name: Build signed release APK
        run: ./gradlew assembleStandardRelease --stacktrace

      # Same single selection as the publish job: one path, exported, used by every later step.
      - name: Select release APK
        run: |
          set -euo pipefail
          APK=$(bash scripts/select-release-apk.sh app/build/outputs/apk/standard/release)
          echo "Selected: $APK"
          echo "RELEASE_APK=$APK" >> "$GITHUB_ENV"

      - name: Verify signature and certificate identity
        env:
          EXPECTED_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          : "${RELEASE_APK:?RELEASE_APK was not exported by the selection step}"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          ASIGN="$ANDROID_HOME/build-tools/$BT/apksigner"
          "$ASIGN" verify --print-certs "$RELEASE_APK"
          FP=$("$ASIGN" verify --print-certs "$RELEASE_APK" | grep -i 'sha-256 digest' | head -1 | grep -oE '[0-9a-fA-F]{64}' | head -1 | tr 'A-F' 'a-f')
          echo "Signer certificate SHA-256: $FP"
          if [ -z "${EXPECTED_SHA256:-}" ]; then
            echo "::error::Repository variable RELEASE_CERT_SHA256 is not set; certificate identity cannot be enforced."
            exit 1
          fi
          EXPECTED=$(echo "$EXPECTED_SHA256" | tr -d ' :' | tr 'A-F' 'a-f')
          if [ "$FP" != "$EXPECTED" ]; then
            echo "::error::Signing certificate mismatch. expected=$EXPECTED actual=$FP"
            exit 1
          fi
          echo "Certificate identity matches the expected production identity."
          "$ANDROID_HOME/build-tools/$BT/aapt2" dump badging "$RELEASE_APK" | head -3
          sha256sum "$RELEASE_APK"
          cp "$RELEASE_APK" "GenZKeyboard-${{ github.run_number }}-signed.apk"

      - name: Verify the signed APK carries no unverified artwork
        run: |
          set -euo pipefail
          : "${RELEASE_APK:?RELEASE_APK was not exported by the selection step}"
          python3 scripts/check-artwork-provenance.py --apk "$RELEASE_APK"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: genz-keyboard-signed-release-apk
          path: GenZKeyboard-*-signed.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release APK
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMGR=$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Version consistency
        run: bash scripts/check-release-version.sh "${{ inputs.version }}"

      # Release licensing gate, first thing in the only job that can create a GitHub Release.
      # Deliberately unconditional: no `if:`, no input, no continue-on-error. A manual dispatch
      # cannot reach the build, the asset upload or `gh release create` without passing it, so a
      # failure here means no asset is ever attached to a release.
      - name: Artwork licensing gate (release)
        run: python3 scripts/check-artwork-provenance.py --release

      # A release APK must be signed with a key that stays the same across releases, or
      # installed copies can never be updated. The key is never committed: it is supplied
      # through repository secrets. There is deliberately no fallback — without the keystore
      # the job stops here rather than publishing a differently-signed APK under the same
      # application id.
      - name: Configure release signing
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "Using keystore from repository secrets"
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
            {
              echo "RELEASE_STORE_FILE=release.keystore"
              echo "RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
              echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
              echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
            } >> local.properties
            echo "SIGNING=release key" >> "$GITHUB_ENV"
          else
            echo "::error::RELEASE_KEYSTORE_B64 is not configured. Refusing to build a production release with the debug key."
            exit 1
          fi

      - name: Build release APK
        run: ./gradlew assembleStandardRelease --stacktrace

      # One APK is selected, once, and every later step works on that exact path. Before this,
      # three steps each ran their own `ls`, with two different filters, so the file that was
      # verified and the file that was uploaded could differ. scripts/select-release-apk.sh refuses
      # to guess: zero APKs, more than one, or a lone unsigned APK are all hard failures.
      - name: Select release APK
        id: select
        run: |
          set -euo pipefail
          APK=$(bash scripts/select-release-apk.sh app/build/outputs/apk/standard/release)
          echo "Selected:  $APK"

          PUB="GenZKeyboard-${{ inputs.version }}.apk"
          cp "$APK" "$PUB"
          PUB_ABS="$PWD/$PUB"

          # The checksum is taken from the file that will be uploaded, not from the build output.
          SHA=$(sha256sum "$PUB_ABS" | cut -d' ' -f1)
          printf '%s  %s\n' "$SHA" "$PUB" > "$PUB.sha256"
          echo "Published: $PUB_ABS"
          echo "sha256:    $SHA"

          {
            echo "RELEASE_APK=$PUB_ABS"
            echo "RELEASE_APK_SHA256=$SHA"
          } >> "$GITHUB_ENV"

      # Everything below operates on $RELEASE_APK, the file that will be attached to the release.
      - name: Inspect the release APK that will be published
        run: |
          set -euo pipefail
          : "${RELEASE_APK:?RELEASE_APK was not exported by the selection step}"
          ls -l "$RELEASE_APK"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/aapt2" dump badging "$RELEASE_APK" | head -3
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$RELEASE_APK" | head -5

      # The artwork check runs against the published bytes, not the build output.
      - name: Verify the release APK carries no unverified artwork
        run: |
          set -euo pipefail
          : "${RELEASE_APK:?RELEASE_APK was not exported by the selection step}"
          python3 scripts/check-artwork-provenance.py --apk "$RELEASE_APK"

      - name: Verify certificate identity before publishing
        env:
          EXPECTED_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          : "${RELEASE_APK:?RELEASE_APK was not exported by the selection step}"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          ASIGN="$ANDROID_HOME/build-tools/$BT/apksigner"
          FP=$("$ASIGN" verify --print-certs "$RELEASE_APK" | grep -i 'sha-256 digest' | head -1 | grep -oE '[0-9a-fA-F]{64}' | head -1 | tr 'A-F' 'a-f')
          if [ -z "${EXPECTED_SHA256:-}" ]; then
            echo "::error::RELEASE_CERT_SHA256 is not set; refusing to publish an unverified identity."
            exit 1
          fi
          EXPECTED=$(echo "$EXPECTED_SHA256" | tr -d ' :' | tr 'A-F' 'a-f')
          if [ "$FP" != "$EXPECTED" ]; then
            echo "::error::Signing certificate mismatch. expected=$EXPECTED actual=$FP"
            exit 1
          fi
          echo "Certificate identity verified: $FP"

      # The notes are generated, never typed into this file: the version name and code come from
      # version.properties (the same values Gradle built with) and the changelog comes from the
      # fastlane file F-Droid reads. The in-app update check parses the `versionCode:` line, so a
      # hand-written body is how the app ends up offering an update to itself.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.version }}
          SIGNING: ${{ env.SIGNING }}
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/^versionName=//p' version.properties | tail -1 | tr -d '[:space:]')
          VERSION_CODE=$(sed -n 's/^versionCode=//p' version.properties | tail -1 | tr -d '[:space:]')
          CHANGELOG="fastlane/metadata/android/en-US/changelogs/$VERSION_CODE.txt"
          if [ ! -s "$CHANGELOG" ]; then
            echo "::error::$CHANGELOG is missing or empty; refusing to publish notes without a changelog."
            exit 1
          fi
          # The identity of the published bytes, so the in-app updater can tell a user when an
          # update cannot be installed over their build (a different signing key) before they
          # download it. UpdateChecker reads this line.
          : "${RELEASE_APK:?RELEASE_APK was not exported by the selection step}"
          : "${RELEASE_APK_SHA256:?RELEASE_APK_SHA256 was not exported by the selection step}"
          if [ ! -f "$RELEASE_APK" ]; then
            echo "::error::the selected APK no longer exists: $RELEASE_APK"
            exit 1
          fi
          if [ "$(sha256sum "$RELEASE_APK" | cut -d' ' -f1)" != "$RELEASE_APK_SHA256" ]; then
            echo "::error::the APK changed after it was selected and checked; refusing to publish"
            exit 1
          fi
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          SIGNER=$("$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$RELEASE_APK" \
            | grep -i 'sha-256 digest' | head -1 | grep -oE '[0-9a-fA-F]{64}' | head -1 | tr 'A-F' 'a-f')
          echo "Publishing $RELEASE_APK"
          echo "sha256 $RELEASE_APK_SHA256"
          echo "signer $SIGNER"

          NOTES=$(cat <<EOF
          GenZ Keyboard - an Android keyboard built in Kotlin and Jetpack Compose, in the
          Material 3 Expressive design language.

          Created by Umaiz Sufiyan (https://github.com/sufiyan-sabeel).

          versionCode: $VERSION_CODE
          signature: $SIGNER
          sha256: $RELEASE_APK_SHA256

          ### What changed in $VERSION_NAME

          $(cat "$CHANGELOG")

          ### Artwork note

          Three further themes are prepared but not included: the windmill, samurai and sakura
          images are recorded in the repository's artwork inventory as carrying other artists'
          signatures, and are withheld pending permission. They are absent, not broken.

          ### Notes

          - This APK is the \`standard\` flavour. The \`fdroid\` flavour ships the same keyboard
            without the bundled theme illustrations.
          - No analytics, no advertising and no crash reporting. What you type stays on the device
            except when you use a network feature you configured yourself - see PRIVACY.md for the
            complete list.
          EOF
          )
          # Upload exactly the path that was selected, checksummed, artwork-checked and
          # certificate-checked. No step after this one may choose an APK of its own.
          SHA_FILE="$RELEASE_APK.sha256"
          if [ ! -f "$SHA_FILE" ]; then
            echo "::error::checksum file missing: $SHA_FILE"
            exit 1
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists - replacing the APK asset and refreshing the notes"
            gh release upload "$TAG" "$RELEASE_APK" "$SHA_FILE" --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" "$RELEASE_APK" "$SHA_FILE" \
              --title "GenZ Keyboard $TAG" --notes "$NOTES"
          fi
