AuthorName: Umaiz Sufiyan

SourceCode: https://github.com/sufiyan-sabeel/genZ-keyboard
IssueTracker: https://github.com/sufiyan-sabeel/genZ-keyboard/issues
Changelog: https://github.com/sufiyan-sabeel/genZ-keyboard/releases

# No website exists apart from the source repository, and the reference says the source URL must
# not be reused as WebSite, so WebSite is omitted deliberately.

# The keyboard can talk to proprietary services: GIF search through Klipy or Giphy, and AI text
# fixing through Gemini, Claude, OpenAI, Groq or OpenRouter. Both are opt-in, ship disabled, and
# need a key the user supplies. Nothing is sent by default and no keys are bundled, but the
# capability is declared rather than left for a reviewer to discover.
# Not declared: Tracking (no analytics, and network use is user-initiated), NonFreeDep (no
# proprietary app is required), NonFreeAssets (the fdroid flavour bundles no third-party
# artwork; emoji and fonts are CC-BY / Apache / OFL), TetheredNet (AI endpoints are
# user-configurable, and a custom service can be added).
AntiFeatures:
  NonFreeNet:
    en-US: Optional GIF search and AI text fixing use third-party services with the user's own keys.

MaintainerNotes: |
  GenZ Keyboard is an input method. The default build flavour is `standard` (used for GitHub
  releases); F-Droid builds the `fdroid` flavour, which is the same keyboard without the ten
  bundled anime illustrations, whose redistribution rights are unresolved. With no bundled
  picture each theme falls back to the palette sampled from its artwork, so it stays a distinct
  colour theme rather than a broken one.

  The app has no submodules and no NDK requirement. The Gradle module is `app`, so the task is
  `assembleFdroidRelease` and the APK lands in `app/build/outputs/apk/fdroid/release/`.

  Proprietary dependencies were removed for F-Droid: `com.google.mlkit:genai-proofreading`
  (on-device Gemini Nano) is gone from the source. CI fails the build if a known proprietary
  group reappears on the runtime classpath, and if the `standard` and `fdroid` flavours stop
  differing in the expected way (artwork present in one, absent in the other).

  versionCode is never reused: 1.0.3 shipped as 7 and was rebuilt as 8, 1.0.4 is 9, 1.0.5 is 10.

