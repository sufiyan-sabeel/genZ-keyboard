# https://gitlab.com/fdroid/fdroiddata and open a merge request. Field names, the category
# identifiers and the anti-feature identifiers below were checked against
# https://f-droid.org/docs/Build_Metadata_Reference/ and
# https://gitlab.com/fdroid/fdroiddata/-/raw/master/config/categories.yml.

