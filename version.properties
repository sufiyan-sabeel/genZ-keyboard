# Single source of truth for the app version.
#
# app/build.gradle.kts reads these two values; nothing else in the repository hardcodes a
# version. CI overrides them with -PversionName / -PversionCode and refuses to build when the
# tag, this file and the Gradle values disagree (scripts/check-release-version.sh).
#
# versionCode must increase on every build that is ever published, including a rebuild of the
# same versionName: F-Droid rejects a second binary for a version code it has already built.
# Never reuse a code for a different binary.
versionName=1.0.7
versionCode=12
